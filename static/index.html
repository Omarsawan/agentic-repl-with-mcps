<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      document.documentElement.dataset.theme = saved || 'dark';
    })();
  </script>
  <style>
    :root {
      --bg-page:         #f0f2f5;
      --bg-surface:      #fff;
      --bg-surface-alt:  #f9fafb;
      --bg-code:         #f3f4f6;
      --bg-tool-pre:     #fafaf9;
      --bg-user-avatar:  #dbeafe;
      --bg-avatar:       #e5e7eb;
      --bg-error:        #fef2f2;
      --border:          #e5e7eb;
      --border-input:    #d1d5db;
      --border-error:    #fca5a5;
      --border-tool-pre: #e7e5e4;
      --text-primary:    #111827;
      --text-secondary:  #374151;
      --text-muted:      #6b7280;
      --text-faint:      #9ca3af;
      --text-tool:       #92400e;
      --text-tool-pre:   #1c1917;
      --accent:          #2563eb;
      --accent-hover:    #1d4ed8;
      --accent-disabled: #93c5fd;
      --accent-tool:     #f59e0b;
      --table-th-bg:     #f9fafb;
    }

    html[data-theme="dark"] {
      --bg-page:         #0f1117;
      --bg-surface:      #1a1d24;
      --bg-surface-alt:  #22262f;
      --bg-code:         #1e2027;
      --bg-tool-pre:     #1a1d24;
      --bg-user-avatar:  #1e3a5f;
      --bg-avatar:       #2d3140;
      --bg-error:        #2d1515;
      --border:          #2d3140;
      --border-input:    #3a3f50;
      --border-error:    #7f1d1d;
      --border-tool-pre: #2d2c2b;
      --text-primary:    #e5e7eb;
      --text-secondary:  #d1d5db;
      --text-muted:      #9ca3af;
      --text-faint:      #6b7280;
      --text-tool:       #fbbf24;
      --text-tool-pre:   #e7e5e4;
      --accent:          #3b82f6;
      --accent-hover:    #2563eb;
      --accent-disabled: #1e3a5f;
      --accent-tool:     #f59e0b;
      --table-th-bg:     #22262f;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-page);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    header h1 span { color: var(--text-muted); font-weight: 400; font-size: 13px; margin-left: 8px; }

    .header-actions { display: flex; gap: 8px; }
    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-input);
      background: var(--bg-surface);
      font-size: 13px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background 0.15s;
    }
    .btn:hover { background: var(--bg-surface-alt); }
    .btn-danger { color: #dc2626; border-color: var(--border-error); }
    .btn-danger:hover { background: var(--bg-error); }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Message rows ── */
    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 780px;
      width: 100%;
    }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.assistant { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      background: var(--bg-avatar);
    }
    .msg-row.user .avatar { background: var(--bg-user-avatar); }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 14px;
      max-width: 640px;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .bubble {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* markdown inside assistant bubble */
    .bubble p { margin: 0 0 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble pre {
      background: var(--bg-code);
      border-radius: 6px;
      padding: 10px 12px;
      overflow-x: auto;
      font-size: 13px;
      margin: 8px 0;
    }
    .bubble code {
      background: var(--bg-code);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 13px;
    }
    .bubble pre code { background: none; padding: 0; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
    .bubble table { border-collapse: collapse; font-size: 13px; margin: 8px 0; }
    .bubble th, .bubble td { border: 1px solid var(--border-input); padding: 4px 10px; }
    .bubble th { background: var(--table-th-bg); }

    /* ── Tool call block ── */
    .tool-block {
      align-self: flex-start;
      max-width: 680px;
      width: 100%;
    }
    details.tool-details {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-tool);
      border-radius: 8px;
      overflow: hidden;
      font-size: 13px;
    }
    details.tool-details summary {
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      color: var(--text-tool);
      font-weight: 500;
      list-style: none;
    }
    details.tool-details summary::-webkit-details-marker { display: none; }
    .tool-icon { font-size: 14px; }
    .tool-name { font-family: monospace; }
    .tool-chevron { margin-left: auto; transition: transform 0.15s; color: var(--text-faint); }
    details[open] .tool-chevron { transform: rotate(90deg); }
    .spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--border-input);
      border-top-color: var(--accent-tool);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tool-body { padding: 0 12px 10px; display: flex; flex-direction: column; gap: 8px; }
    .tool-section { display: flex; flex-direction: column; gap: 4px; }
    .tool-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .tool-pre {
      background: var(--bg-tool-pre);
      border: 1px solid var(--border-tool-pre);
      border-radius: 5px;
      padding: 7px 10px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-tool-pre);
      max-height: 300px;
      overflow-y: auto;
    }

    /* ── Thinking indicator ── */
    .thinking-row {
      display: flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
    }
    .thinking-dots {
      display: flex;
      gap: 4px;
      padding: 10px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      border-bottom-left-radius: 4px;
    }
    .thinking-dots span {
      width: 7px; height: 7px;
      background: var(--text-faint);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }

    /* ── Error message ── */
    .error-row {
      align-self: flex-start;
      background: var(--bg-error);
      border: 1px solid var(--border-error);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      color: #dc2626;
      max-width: 680px;
    }

    /* ── Inline argument input request ── */
    .input-request {
      align-self: flex-start;
      max-width: 560px;
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-request-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .input-request-row {
      display: flex;
      gap: 8px;
    }
    .input-request-field {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--border-input);
      border-radius: 6px;
      font-size: 13px;
      background: var(--bg-surface);
      color: var(--text-primary);
      outline: none;
    }
    .input-request-field:focus { border-color: var(--accent); }
    .input-request-submit {
      padding: 7px 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .input-request-submit:hover { background: var(--accent-hover); }
    .input-request-done {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ── Input area ── */
    footer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 20px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-input);
      border-radius: 8px;
      font-size: 14px;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 160px;
      overflow-y: auto;
      transition: border-color 0.15s;
      background: var(--bg-surface);
      color: var(--text-primary);
    }
    #input:focus { border-color: var(--accent); }
    #input:disabled { background: var(--bg-surface-alt); color: var(--text-faint); }
    #send-btn {
      padding: 10px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:disabled { background: var(--accent-disabled); cursor: not-allowed; }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-faint);
      gap: 8px;
      pointer-events: none;
    }
    .empty-state .icon { font-size: 40px; }
    .empty-state p { font-size: 15px; }
  </style>
</head>
<body>

<header>
  <h1>MCP Agent <span id="tool-count"></span></h1>
  <div class="header-actions">
    <button class="btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <button class="btn btn-danger" onclick="resetChat()">Reset</button>
  </div>
</header>

<div id="chat">
  <div class="empty-state" id="empty-state">
    <div class="icon">🤖</div>
    <p>Send a message to get started</p>
  </div>
</div>

<footer>
  <textarea id="input" rows="1" placeholder="Type a message…" autofocus></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</footer>

<script>
  marked.setOptions({ breaks: true, gfm: true });

  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const emptyState = document.getElementById('empty-state');

  // ── Event type enum ──────────────────────────────────────────────────────
  const EventType = Object.freeze({
    AGENT_NOTIFICATION: 'agent_notification',
    INPUT_PROMPT:   'input_prompt',
    INPUT_RESPONSE: 'input_response',
    TOOL_CALL:      'tool_call',
    TOOL_RESULT:    'tool_result',
    ASSISTANT:      'assistant',
    ERROR:          'error',
    SYSTEM:         'system',
  });

  // ── WebSocket ────────────────────────────────────────────────────────────
  const wsUrl = `ws://${window.location.host}/ws`;
  let ws;
  let pendingToolCalls = [];
  let thinkingEl = null;

  function connect() {
    ws = new WebSocket(wsUrl);
    ws.onmessage = (e) => handleEvent(JSON.parse(e.data));
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();

  // ── Event handler ────────────────────────────────────────────────────────
  function handleEvent(event) {
    if (event.type === EventType.TOOL_CALL) {
      removeThinking();
      const el = addToolCall(event.name, event.args);
      pendingToolCalls.push(el);
    } else if (event.type === EventType.TOOL_RESULT) {
      const el = pendingToolCalls.shift();
      if (el) setToolResult(el, event.result);
      addThinking();
    } else if (event.type === EventType.ASSISTANT) {
      removeThinking();
      addMessage('assistant', event.content);
      setInputEnabled(true);
    } else if (event.type === EventType.ERROR) {
      removeThinking();
      addError(event.message);
      setInputEnabled(true);
    } else if (event.type === EventType.AGENT_NOTIFICATION) {
      removeThinking();
      addMessage('assistant', event.content);
    } else if (event.type === EventType.INPUT_PROMPT) {
      removeThinking();
      setInputEnabled(false);
      addInputRequest(event.prompt);
    }
  }

  // ── DOM helpers ──────────────────────────────────────────────────────────
  function hideEmpty() {
    emptyState.style.display = 'none';
  }

  function addMessage(role, text) {
    hideEmpty();
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🧑' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'user') {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = marked.parse(text);
    }

    row.append(avatar, bubble);
    chatEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addToolCall(name, args) {
    hideEmpty();
    const wrap = document.createElement('div');
    wrap.className = 'tool-block';

    const details = document.createElement('details');
    details.className = 'tool-details';

    const summary = document.createElement('summary');
    const spinner = document.createElement('div');
    spinner.className = 'spinner';
    spinner.dataset.spinner = '1';
    summary.innerHTML = `<span class="tool-icon">⚙️</span><span class="tool-name">${escHtml(name)}</span>`;
    summary.prepend(spinner);
    const chevron = document.createElement('span');
    chevron.className = 'tool-chevron';
    chevron.textContent = '▶';
    summary.appendChild(chevron);

    const body = document.createElement('div');
    body.className = 'tool-body';

    if (args && Object.keys(args).length > 0) {
      const sec = document.createElement('div');
      sec.className = 'tool-section';
      sec.innerHTML = `<span class="tool-label">Arguments</span><pre class="tool-pre">${escHtml(JSON.stringify(args, null, 2))}</pre>`;
      body.appendChild(sec);
    }

    details.append(summary, body);
    wrap.appendChild(details);
    chatEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function setToolResult(wrap, result) {
    const details = wrap.querySelector('details');
    const body = details.querySelector('.tool-body');
    const spinner = details.querySelector('[data-spinner]');
    if (spinner) spinner.remove();

    const sec = document.createElement('div');
    sec.className = 'tool-section';
    sec.innerHTML = `<span class="tool-label">Result</span><pre class="tool-pre">${escHtml(result)}</pre>`;
    body.appendChild(sec);
    scrollToBottom();
  }

  function addThinking() {
    removeThinking();
    const row = document.createElement('div');
    row.className = 'thinking-row';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';
    const dots = document.createElement('div');
    dots.className = 'thinking-dots';
    dots.innerHTML = '<span></span><span></span><span></span>';
    row.append(avatar, dots);
    row.dataset.thinking = '1';
    chatEl.appendChild(row);
    thinkingEl = row;
    scrollToBottom();
  }

  function removeThinking() {
    if (thinkingEl) {
      thinkingEl.remove();
      thinkingEl = null;
    }
  }

  function addError(msg) {
    const el = document.createElement('div');
    el.className = 'error-row';
    el.textContent = `⚠️ ${msg}`;
    chatEl.appendChild(el);
    scrollToBottom();
  }

  function addInputRequest(promptText) {
    hideEmpty();
    const wrap = document.createElement('div');
    wrap.className = 'input-request';

    const label = document.createElement('div');
    label.className = 'input-request-label';
    label.textContent = promptText;

    const row = document.createElement('div');
    row.className = 'input-request-row';

    const field = document.createElement('input');
    field.type = 'text';
    field.className = 'input-request-field';
    field.placeholder = 'Enter value…';

    const btn = document.createElement('button');
    btn.className = 'input-request-submit';
    btn.textContent = 'Submit';

    function submit() {
      const value = field.value;
      ws.send(JSON.stringify({ type: EventType.INPUT_RESPONSE, value }));
      // Replace form with read-only display
      row.remove();
      const done = document.createElement('div');
      done.className = 'input-request-done';
      done.textContent = value.trim() ? `↳ ${value}` : '↳ (skipped)';
      wrap.appendChild(done);
      scrollToBottom();
    }

    btn.addEventListener('click', submit);
    field.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });

    row.append(field, btn);
    wrap.append(label, row);
    chatEl.appendChild(wrap);
    scrollToBottom();
    field.focus();
  }

  function scrollToBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Input handling ───────────────────────────────────────────────────────
  function setInputEnabled(enabled) {
    inputEl.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if (enabled) inputEl.focus();
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || inputEl.disabled) return;
    inputEl.value = '';
    autoResize();
    addMessage('user', text);
    addThinking();
    setInputEnabled(false);
    pendingToolCalls = [];
    ws.send(JSON.stringify({ content: text }));
  }

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener('input', autoResize);

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  }

  // ── Reset ────────────────────────────────────────────────────────────────
  async function resetChat() {
    await fetch('/reset', { method: 'POST' });
    chatEl.innerHTML = '';
    chatEl.appendChild(emptyState);
    emptyState.style.display = '';
    thinkingEl = null;
    pendingToolCalls = [];
    setInputEnabled(true);
  }

  // ── Theme ────────────────────────────────────────────────────────────────
  function toggleTheme() {
    const html = document.documentElement;
    const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
    html.dataset.theme = next;
    localStorage.setItem('theme', next);
    document.getElementById('theme-btn').textContent = next === 'dark' ? '🌙' : '☀️';
  }

  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = document.documentElement.dataset.theme === 'dark' ? '🌙' : '☀️';
  });
</script>
</body>
</html>
